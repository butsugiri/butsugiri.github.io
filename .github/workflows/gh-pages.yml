name: Build and Deploy to Github Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: local/jekyll:latest
          cache-from: type=gha,scope=jekyll
          cache-to: type=gha,mode=max,scope=jekyll
      - name: Build Jekyll site
        run: docker compose run --rm --pull never -e JEKYLL_ENV=production service_jekyll bundle exec jekyll build --trace

      - name: Check generated HTML
        run: python3 scripts/check_site.py

      - name: Upload validated site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-site
          path: my-blog/_site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build_and_deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download validated site
        uses: actions/download-artifact@v4
        with:
          name: jekyll-site
          path: public
      - name: Deploy validated site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public
